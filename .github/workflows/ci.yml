name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  tests:
    name: Tests (Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, exif, pcntl, bcmath, gd, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress && npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run tests
        run: composer test

  style:
    name: Style (Pint, Prettier, ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress && npm ci

      - name: Pint (check only)
        run: vendor/bin/pint --test

      - name: Prettier (check only)
        run: npm run format:check

      - name: ESLint (no fix)
        run: npx eslint .
