name: Test & Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: "latest"
  push:
    branches:
      - main

permissions:
  contents: write

env:
  IMAGE: mateocarciu/taskly

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, exif, pcntl, bcmath, gd, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress && npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run tests
        run: composer test

  style:
    name: Style (Pint, Prettier, ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress && npm ci

      - name: Pint (check only)
        run: vendor/bin/pint --test

      - name: Prettier (check only)
        run: npm run format:check

      - name: ESLint (no fix)
        run: npx eslint .

  release:
    needs: [tests, style]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Semantic release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-save semantic-release@25 @semantic-release/exec@7 >/dev/null 2>&1
          npx semantic-release
          if [ -f .version ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cat .version)" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [tests, style, release]
    if: always() && needs.tests.result == 'success' && needs.style.result == 'success' && (needs.release.result == 'skipped' || needs.release.outputs.released == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: mateocarciu
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ github.event_name == 'push' && format('{0}:v{1}', env.IMAGE, needs.release.outputs.version) || format('{0}:{1}', env.IMAGE, inputs.tag || 'latest') }}
            ${{ github.event_name == 'push' && format('{0}:latest', env.IMAGE) || '' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/app/Taskly

            TAG=${{ github.event_name == 'push' && format('v{0}', needs.release.outputs.version) || inputs.tag || 'latest' }}
            case "$TAG" in
              latest|v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::Tag invalide: '$TAG' (attendu: latest ou vX.Y.Z)" && exit 1 ;;
            esac
            export TAG

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --wait --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

            docker image prune -f
